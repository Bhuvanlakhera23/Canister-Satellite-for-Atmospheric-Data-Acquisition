<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc"><title id="title">CanSat telemetry data flow</title><desc id="desc">Functional data-flow description from the 2024 team report, not independently confirmed final connections: acquisition, packets, storage, radio, ground display and return commands.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#1b7f79"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8fb"/><g font-family="Arial,sans-serif" fill="#172d43"><text x="28" y="40" font-size="26" font-weight="bold" fill="#172d43">From sensor reading to ground-station display</text><rect x="28" y="95" width="255" height="135" rx="10" fill="white" stroke="#9db5c7"/><text x="46" y="125" font-size="20" font-weight="bold" fill="#172d43">Acquire</text><text x="46" y="153" font-size="16" font-weight="normal" fill="#172d43">Read sensor values</text><text x="46" y="177" font-size="16" font-weight="normal" fill="#172d43">Time and mission state</text><text x="46" y="201" font-size="16" font-weight="normal" fill="#172d43">Maintain packet counter</text><rect x="340" y="95" width="255" height="135" rx="10" fill="white" stroke="#9db5c7"/><text x="358" y="125" font-size="20" font-weight="bold" fill="#172d43">Organize and transmit</text><text x="358" y="153" font-size="16" font-weight="normal" fill="#172d43">Format telemetry fields</text><text x="358" y="177" font-size="16" font-weight="normal" fill="#172d43">Send via XBee / Zigbee</text><text x="358" y="201" font-size="16" font-weight="normal" fill="#172d43">Record locally on SD card</text><rect x="652" y="95" width="255" height="135" rx="10" fill="white" stroke="#9db5c7"/><text x="670" y="125" font-size="20" font-weight="bold" fill="#172d43">Receive and parse</text><text x="670" y="153" font-size="16" font-weight="normal" fill="#172d43">Ground radio / controller</text><text x="670" y="177" font-size="16" font-weight="normal" fill="#172d43">Separate telemetry fields</text><text x="670" y="201" font-size="16" font-weight="normal" fill="#172d43">Update interface values</text><rect x="964" y="95" width="280" height="135" rx="10" fill="white" stroke="#9db5c7"/><text x="982" y="125" font-size="20" font-weight="bold" fill="#172d43">Inspect and record</text><text x="982" y="153" font-size="16" font-weight="normal" fill="#172d43">Display telemetry fields</text><text x="982" y="177" font-size="16" font-weight="normal" fill="#172d43">Plot selected channels</text><text x="982" y="201" font-size="16" font-weight="normal" fill="#172d43">Export telemetry as CSV</text><path d="M283 165 H340" fill="none" stroke="#1b7f79" stroke-width="3" marker-end="url(#arrow)"/><path d="M595 165 H652" fill="none" stroke="#1b7f79" stroke-width="3" marker-end="url(#arrow)"/><path d="M907 165 H964" fill="none" stroke="#1b7f79" stroke-width="3" marker-end="url(#arrow)"/><path d="M1100 230 V310 H470 V230" fill="none" stroke="#1b7f79" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="300" font-size="18" font-weight="normal" fill="#172d43">Return path for ground-station commands</text><text x="28" y="375" font-size="16" font-weight="normal" fill="#172d43">Field groups: identity / time / packet count · environment · power · GNSS · inertial data · software state</text><text x="28" y="405" font-size="15" font-weight="normal" fill="#172d43">2024 team-report description; not an independent check of final assembled connections.</text></g></svg>
